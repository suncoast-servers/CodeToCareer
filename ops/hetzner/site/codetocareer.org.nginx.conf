server {
    listen 80;
    listen [::]:80;
    server_name codetocareer.org www.codetocareer.org;

    root /var/www/codetocareer.org/public;
    index index.html;
    access_log /var/www/codetocareer.org/logs/access.log;
    error_log  /var/www/codetocareer.org/logs/error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
